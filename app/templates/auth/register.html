{% extends 'base.html' %}
{% import "bootstrap_wtf.html" as wtf %}

{% block content %}
<style>
  body, html {
    height: 100%;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to right, #23a6d5, #23d5ab);
    overflow-x: hidden;
    position: relative;
  }

  /* Animated Promo Banner */
  .promo-banner {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .promo-content {
    display: flex;
    gap: 2rem;
    animation: slideLeft 20s linear infinite;
    opacity: 0.1;
  }

  .promo-content:hover {
    animation-play-state: paused;
  }

  .chat-bubble {
    font-size: 3.5rem;
    color: #6c63ff;
    filter: drop-shadow(0 0 3px rgba(108, 99, 255, 0.4));
    animation: floatUpDown 6s ease-in-out infinite alternate;
  }

  .promo-text {
    font-weight: 700;
    font-size: 2rem;
    color: #6c63ff;
  }

  @keyframes slideLeft {
    from {
      transform: translateX(0%);
    }
    to {
      transform: translateX(-50%);
    }
  }

  @keyframes floatUpDown {
    0% {
      transform: translateY(0);
    }
    100% {
      transform: translateY(-15px);
    }
  }

  /* Video Background */
  .video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  /* Register Container */
  .register-container {
    position: relative;
    max-width: 450px;
    margin: 7rem auto;
    padding: 3rem 2.5rem;
    background: rgba(255, 255, 255, 0.98);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    z-index: 10;
    cursor: grab;
    animation: fadeIn 1s ease-out;
  }

  .register-container:active {
    cursor: grabbing;
  }

  .register-container h1 {
    text-align: center;
    font-size: 2.5rem;
    font-weight: 800;
    color: #2c3e50;
    margin-bottom: 1.5rem;
  }

  input:focus {
    box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
    transform: scale(1.02);
    transition: 0.3s;
  }

  .btn-primary {
    position: relative;
    overflow: hidden;
    transition: background 0.3s ease-in-out;
  }

  .btn-primary::after {
    content: "";
    position: absolute;
    background: rgba(255, 255, 255, 0.3);
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    transform: skewX(-20deg);
    transition: all 0.5s ease-in-out;
  }

  .btn-primary:hover::after {
    left: 125%;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

<!-- 🌌 Animated Bubbles Banner -->
<div class="promo-banner">
  <div class="promo-content">
    <div class="chat-bubble">💬</div>
    <div class="promo-text">Welcome to <strong>ChitChat</strong></div>
    <div class="chat-bubble">📨</div>
    <div class="promo-text">Chat & Connect</div>
    <div class="chat-bubble">👥</div>
    <div class="promo-text">Find Friends</div>
    <div class="chat-bubble">🎉</div>
    <div class="promo-text">Start Exploring!</div>
  </div>
</div>

<!-- 🎥 Background Video -->
<video autoplay muted loop class="video-bg">
  <source src="https://cdn.pixabay.com/vimeo/577279265/Abstract%20Background%20-%2032854.mp4?width=640&hash=c72e350e0bcec0c6e32a647418d73183ec69f6cb" type="video/mp4">
  Your browser does not support the video tag.
</video>

<!-- 📝 Register Form -->
<div class="register-container" id="registerForm">
  <h1>{{ _('Register') }}</h1>
  {{ wtf.quick_form(form) }}
  <p style="text-align:center; margin-top:1rem;">
    {{ _('Already have an account?') }}
    <a href="{{ url_for('auth.login') }}">{{ _('Sign In here') }}</a>
  </p>
</div>

<!-- 🧠 Dragging Behavior with Anime.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script>
  const form = document.getElementById('registerForm');
  let isDragging = false;
  let startX, startY;
  let currentX = 0, currentY = 0;

  // Mouse drag events
  form.addEventListener('mousedown', (e) => {
    isDragging = true;
    startX = e.clientX - currentX;
    startY = e.clientY - currentY;
    form.style.cursor = 'grabbing';
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    form.style.cursor = 'grab';
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    currentX = e.clientX - startX;
    currentY = e.clientY - startY;
    anime({
      targets: form,
      translateX: currentX,
      translateY: currentY,
      duration: 200,
      easing: 'easeOutQuad'
    });
  });

  // Touch drag events
  form.addEventListener('touchstart', (e) => {
    isDragging = true;
    const touch = e.touches[0];
    startX = touch.clientX - currentX;
    startY = touch.clientY - currentY;
    form.style.cursor = 'grabbing';
  });

  window.addEventListener('touchend', () => {
    isDragging = false;
    form.style.cursor = 'grab';
  });

  window.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const touch = e.touches[0];
    currentX = touch.clientX - startX;
    currentY = touch.clientY - startY;
    anime({
      targets: form,
      translateX: currentX,
      translateY: currentY,
      duration: 200,
      easing: 'easeOutQuad'
    });
  });
</script>
{% endblock %}
